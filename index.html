<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zero-G Void: Infinite Rescue</title>

  <!-- PWA Manifest & App Configuration -->
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zero-G Void">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud-glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .touch-btn {
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .touch-btn:active, .touch-btn.active {
      background: rgba(59, 130, 246, 0.4);
      border-color: rgba(96, 165, 250, 0.8);
      transform: scale(0.95);
    }
  </style>
</head>
<body class="relative select-none">

  <!-- Main Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Mobile & Desktop HUD Overlay -->
  <div class="absolute inset-x-0 top-0 p-3 sm:p-4 pointer-events-none flex flex-col sm:flex-row justify-between items-center gap-2 z-10">
    
    <!-- Left: Compact Status Bars -->
    <div class="hud-glass rounded-xl p-2 sm:p-3 w-full sm:w-64 flex flex-row sm:flex-col justify-between items-center gap-2">
      <div class="w-1/3 sm:w-full">
        <div class="flex justify-between text-[10px] sm:text-xs font-bold text-red-400 mb-0.5">
          <span>HULL</span><span id="hullVal">100%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
          <div id="hullBar" class="bg-red-500 h-full w-full transition-all duration-150"></div>
        </div>
      </div>
      <div class="w-1/3 sm:w-full">
        <div class="flex justify-between text-[10px] sm:text-xs font-bold text-cyan-400 mb-0.5">
          <span>SHIELD</span><span id="shieldVal">100%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
          <div id="shieldBar" class="bg-cyan-400 h-full w-full transition-all duration-150"></div>
        </div>
      </div>
      <div class="w-1/3 sm:w-full">
        <div class="flex justify-between text-[10px] sm:text-xs font-bold text-amber-400 mb-0.5">
          <span>NITRO</span><span id="nitroVal">100%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
          <div id="nitroBar" class="bg-amber-400 h-full w-full transition-all duration-150"></div>
        </div>
      </div>
    </div>

    <!-- Center: Void Threat Level -->
    <div class="hud-glass rounded-xl px-4 py-2 text-center">
      <div class="text-[10px] sm:text-xs font-semibold tracking-widest text-slate-400 uppercase">VOID THREAT</div>
      <div id="threatLevel" class="text-sm sm:text-lg font-black text-purple-400 tracking-wider">LVL 1 – ASTEROID DRIFT</div>
    </div>

    <!-- Right: Mission Score Badge -->
    <div class="hud-glass rounded-xl p-2 sm:p-3 w-full sm:w-48 text-center sm:text-right flex sm:flex-col justify-between items-center">
      <div class="text-[10px] sm:text-xs font-semibold text-slate-400">MISSION SCORE</div>
      <div id="scoreVal" class="text-xl sm:text-2xl font-black text-white tracking-tight">0000</div>
      <div id="multiplierVal" class="text-[10px] sm:text-xs font-bold text-emerald-400">+100pts / rescue</div>
    </div>
  </div>

  <!-- Mobile On-Screen Touch Controls -->
  <div class="absolute inset-x-0 bottom-0 p-4 sm:p-6 pointer-events-none flex justify-between items-end z-20">
    
    <!-- Left: Virtual Joystick Zone -->
    <div id="joystickZone" class="pointer-events-auto relative w-32 h-32 sm:w-40 sm:h-40 rounded-full touch-btn flex items-center justify-center">
      <div id="joystickKnob" class="absolute w-12 h-12 sm:w-16 sm:h-16 rounded-full bg-cyan-500/50 border-2 border-cyan-300 shadow-lg shadow-cyan-500/30 transition-transform duration-75"></div>
    </div>

    <!-- Right: Action Touch Buttons -->
    <div class="pointer-events-auto flex gap-3 sm:gap-4">
      <button id="btnBrake" class="touch-btn w-16 h-16 sm:w-20 sm:h-20 rounded-full flex flex-col items-center justify-center text-rose-400 font-bold active:scale-95 transition-transform">
        <span class="text-xl">🛑</span>
        <span class="text-[10px] tracking-wider">BRAKE</span>
      </button>
      <button id="btnNitro" class="touch-btn w-16 h-16 sm:w-20 sm:h-20 rounded-full flex flex-col items-center justify-center text-amber-400 font-bold active:scale-95 transition-transform">
        <span class="text-xl">⚡</span>
        <span class="text-[10px] tracking-wider">NITRO</span>
      </button>
    </div>
  </div>

  <script>
    // Register Inline Service Worker for Offline PWA Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'zero-g-void-v1';
          const ASSETS = [
            '/',
            '/index.html',
            'https://cdn.tailwindcss.com'
          ];

          self.addEventListener('install', (e) => {
            e.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
            );
          });

          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then((res) => res || fetch(e.request))
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration error:', err));
      });
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas Sizing
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Input State
    const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };
    const joystick = { active: false, dx: 0, dy: 0, touchId: null };

    // Keyboard Listeners
    window.addEventListener('keydown', e => {
      if (e.key === 'Shift') keys.shift = true;
      if (e.key === ' ') keys.space = true;
      if (['w','ArrowUp'].includes(e.key)) keys.w = true;
      if (['a','ArrowLeft'].includes(e.key)) keys.a = true;
      if (['s','ArrowDown'].includes(e.key)) keys.s = true;
      if (['d','ArrowRight'].includes(e.key)) keys.d = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'Shift') keys.shift = false;
      if (e.key === ' ') keys.space = false;
      if (['w','ArrowUp'].includes(e.key)) keys.w = false;
      if (['a','ArrowLeft'].includes(e.key)) keys.a = false;
      if (['s','ArrowDown'].includes(e.key)) keys.s = false;
      if (['d','ArrowRight'].includes(e.key)) keys.d = false;
    });

    // Mobile Virtual Joystick Logic
    const joystickZone = document.getElementById('joystickZone');
    const joystickKnob = document.getElementById('joystickKnob');

    function handleJoystickMove(clientX, clientY) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const maxRadius = rect.width / 2;

      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joystick.dx = dx / maxRadius;
      joystick.dy = dy / maxRadius;
    }

    joystickZone.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joystick.active = true;
      joystick.touchId = touch.identifier;
      handleJoystickMove(touch.clientX, touch.clientY);
    });

    window.addEventListener('touchmove', e => {
      if (!joystick.active) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystick.touchId) {
          handleJoystickMove(touch.clientX, touch.clientY);
        }
      }
    });

    const resetJoystick = () => {
      joystick.active = false;
      joystick.dx = 0;
      joystick.dy = 0;
      joystick.touchId = null;
      joystickKnob.style.transform = 'translate(0px, 0px)';
    };

    window.addEventListener('touchend', resetJoystick);
    window.addEventListener('touchcancel', resetJoystick);

    // Touch Buttons
    const btnNitro = document.getElementById('btnNitro');
    const btnBrake = document.getElementById('btnBrake');

    btnNitro.addEventListener('touchstart', e => { e.preventDefault(); keys.shift = true; btnNitro.classList.add('active'); });
    btnNitro.addEventListener('touchend', e => { e.preventDefault(); keys.shift = false; btnNitro.classList.remove('active'); });
    btnBrake.addEventListener('touchstart', e => { e.preventDefault(); keys.space = true; btnBrake.classList.add('active'); });
    btnBrake.addEventListener('touchend', e => { e.preventDefault(); keys.space = false; btnBrake.classList.remove('active'); });

    // Core Game Objects
    const player = {
      x: 0, y: 0,
      vx: 0, vy: 0,
      angle: 0,
      hull: 100, shield: 100, nitro: 100,
      rescues: 0, score: 0
    };

    const camera = { x: 0, y: 0 };
    const asteroids = [];
    const astronauts = [];
    const voids = [];
    const particles = [];

    // Generator Utilities
    function spawnAsteroid() {
      const dist = 600 + Math.random() * 800;
      const angle = Math.random() * Math.PI * 2;
      const points = [];
      const numPoints = 7 + Math.floor(Math.random() * 5);
      const baseRadius = 25 + Math.random() * 25;
      for (let i = 0; i < numPoints; i++) {
        const a = (i / numPoints) * Math.PI * 2;
        const r = baseRadius * (0.8 + Math.random() * 0.4);
        points.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
      }
      asteroids.push({
        x: player.x + Math.cos(angle) * dist,
        y: player.y + Math.sin(angle) * dist,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        rot: 0, rotSpeed: (Math.random() - 0.5) * 0.03,
        radius: baseRadius,
        points: points
      });
    }

    function spawnAstronaut() {
      const dist = 400 + Math.random() * 600;
      const angle = Math.random() * Math.PI * 2;
      astronauts.push({
        x: player.x + Math.cos(angle) * dist,
        y: player.y + Math.sin(angle) * dist,
        pulse: 0
      });
    }

    function spawnVoid() {
      const dist = 800 + Math.random() * 1000;
      const angle = Math.random() * Math.PI * 2;
      voids.push({
        x: player.x + Math.cos(angle) * dist,
        y: player.y + Math.sin(angle) * dist,
        radius: 120,
        pull: 0.35,
        rot: 0
      });
    }

    for (let i = 0; i < 12; i++) spawnAsteroid();
    for (let i = 0; i < 4; i++) spawnAstronaut();
    spawnVoid();

    // Main Game Engine Loop
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Update Player Steering & Physics
      let inputX = joystick.active ? joystick.dx : (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
      let inputY = joystick.active ? joystick.dy : (keys.s ? 1 : 0) - (keys.w ? 1 : 0);

      const isNitro = keys.shift && player.nitro > 0;
      const accel = isNitro ? 550 : 250;

      if (isNitro && (inputX !== 0 || inputY !== 0)) {
        player.nitro = Math.max(0, player.nitro - 25 * dt);
      } else if (!keys.shift) {
        player.nitro = Math.min(100, player.nitro + 10 * dt);
      }

      if (inputX !== 0 || inputY !== 0) {
        player.vx += inputX * accel * dt;
        player.vy += inputY * accel * dt;
        player.angle = Math.atan2(inputY, inputX);

        // Thruster Particles
        if (Math.random() < 0.6) {
          particles.push({
            x: player.x - Math.cos(player.angle) * 15,
            y: player.y - Math.sin(player.angle) * 15,
            vx: -Math.cos(player.angle) * 100 + (Math.random() - 0.5) * 40,
            vy: -Math.sin(player.angle) * 100 + (Math.random() - 0.5) * 40,
            life: 0.3,
            color: isNitro ? '#f59e0b' : '#38bdf8'
          });
        }
      }

      // Gravitational Brake Physics
      if (keys.space) {
        const brakeFactor = Math.pow(0.05, dt);
        player.vx *= brakeFactor;
        player.vy *= brakeFactor;
      }

      // Max Speed Clamp
      const maxSpeed = isNitro ? 450 : 220;
      const speed = Math.hypot(player.vx, player.vy);
      if (speed > maxSpeed) {
        player.vx = (player.vx / speed) * maxSpeed;
        player.vy = (player.vy / speed) * maxSpeed;
      }

      player.x += player.vx * dt;
      player.y += player.vy * dt;

      // Void Gravity Attractor Physics
      voids.forEach(v => {
        v.rot += 0.5 * dt;
        const dx = v.x - player.x;
        const dy = v.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 350) {
          const force = (1 - dist / 350) * v.pull * 400 * dt;
          player.vx += (dx / dist) * force;
          player.vy += (dy / dist) * force;
        }
      });

      // Camera Smooth Follow
      camera.x += (player.x - camera.x) * 5 * dt;
      camera.y += (player.y - camera.y) * 5 * dt;

      // Particles Loop
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Astronaut Collection Collision Check
      for (let i = astronauts.length - 1; i >= 0; i--) {
        const a = astronauts[i];
        a.pulse += dt * 4;
        if (Math.hypot(player.x - a.x, player.y - a.y) < 35) {
          astronauts.splice(i, 1);
          player.rescues += 1;
          const yieldPts = Math.max(15, 100 - Math.floor(player.rescues / 3) * 15);
          player.score += yieldPts;
          spawnAstronaut();
          if (asteroids.length < 25) spawnAsteroid();
        }
      }

      // Asteroid Rotations & Collision Check
      asteroids.forEach(ast => {
        ast.x += ast.vx * dt;
        ast.y += ast.vy * dt;
        ast.rot += ast.rotSpeed;
        if (Math.hypot(player.x - ast.x, player.y - ast.y) < ast.radius + 14) {
          player.hull = Math.max(0, player.hull - 10 * dt);
        }
      });

      // Update HUD Values
      document.getElementById('hullBar').style.width = `${player.hull}%`;
      document.getElementById('hullVal').innerText = `${Math.round(player.hull)}%`;
      document.getElementById('shieldBar').style.width = `${player.shield}%`;
      document.getElementById('shieldVal').innerText = `${Math.round(player.shield)}%`;
      document.getElementById('nitroBar').style.width = `${player.nitro}%`;
      document.getElementById('nitroVal').innerText = `${Math.round(player.nitro)}%`;
      document.getElementById('scoreVal').innerText = String(player.score).padStart(4, '0');

      const activeYield = Math.max(15, 100 - Math.floor(player.rescues / 3) * 15);
      document.getElementById('multiplierVal').innerText = `+${activeYield}pts / rescue`;
      
      const threatLevelNum = 1 + Math.floor(player.rescues / 3);
      document.getElementById('threatLevel').innerText = `LVL ${threatLevelNum} – ${threatLevelNum > 4 ? 'SINGULARITY CRISIS' : 'ASTEROID DRIFT'}`;

      // RENDER SECTION
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(canvas.width / 2 - camera.x, canvas.height / 2 - camera.y);

      // Starfield Grid Background
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 100;
      const startX = Math.floor((camera.x - canvas.width) / gridSize) * gridSize;
      const endX = Math.floor((camera.x + canvas.width) / gridSize) * gridSize;
      const startY = Math.floor((camera.y - canvas.height) / gridSize) * gridSize;
      const endY = Math.floor((camera.y + canvas.height) / gridSize) * gridSize;

      for (let x = startX; x <= endX; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, startY);
        ctx.lineTo(x, endY);
        ctx.stroke();
      }
      for (let y = startY; y <= endY; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(startX, y);
        ctx.lineTo(endX, y);
        ctx.stroke();
      }

      // Render Singularities (Black Holes)
      voids.forEach(v => {
        ctx.save();
        ctx.translate(v.x, v.y);
        ctx.rotate(v.rot);

        const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, v.radius);
        grad.addColorStop(0, '#000000');
        grad.addColorStop(0.5, '#7e22ce');
        grad.addColorStop(1, 'transparent');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, v.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, v.radius * 0.4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      });

      // Render Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Stranded Astronauts
      astronauts.forEach(a => {
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.arc(a.x, a.y, 8 + Math.sin(a.pulse) * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#86efac';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Render Asteroids
      ctx.fillStyle = '#475569';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      asteroids.forEach(ast => {
        ctx.save();
        ctx.translate(ast.x, ast.y);
        ctx.rotate(ast.rot);
        ctx.beginPath();
        ast.points.forEach((p, idx) => {
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // Render Player Ship Vector
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      ctx.fillStyle = '#06b6d4';
      ctx.strokeStyle = '#67e8f9';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(-12, -10);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-12, 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
